# Netlify hosts the public site (apps/web) only. The admin and API run from
# docker-compose.yml (Dokploy). Build environment variables, set in the Netlify
# UI, are listed in README.md under "Deploying".
[build]
  command = "pnpm --filter @pca/web build"
  publish = "apps/web/dist/client"
  edge_functions = "apps/web/netlify/edge-functions"

[build.environment]
  NODE_VERSION = "24"

# Public measurement identifier; only the production build receives it here.
[context.production.environment]
  VITE_GA_MEASUREMENT_ID = "G-EGQD2JBT77"
  # Collection remains off unless VITE_ANALYTICS_ENABLED=1 is explicitly set
  # in the deployment environment after privacy and overlapping-tag review.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
