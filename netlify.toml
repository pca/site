# Netlify hosts the public site (apps/web) only. The admin and API run from
# docker-compose.yml (Dokploy). Build environment variables, set in the Netlify
# UI, are listed in README.md under "Deploying".
[build]
  command = "pnpm --filter @pca/web build"
  publish = "apps/web/dist/client"
  edge_functions = "apps/web/netlify/edge-functions"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
